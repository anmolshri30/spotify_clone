[package]
name = "spotify_clone_tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["process-all", "window-all", "http-all", "shell-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional: for finding a free port (use tiny_http?) but we can just let backend pick.
